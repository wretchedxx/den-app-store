description: >-
  💾 Floppy is a self-hosted personal media tracker and Trakt/Letterboxd alternative for movies, TV shows, anime, manga, books, games, music, and podcasts. It provides a clean, unified platform where users can easily log, review, and track their digital consumption over time. By keeping a detailed history of your entertainment activity, Floppy enables you to visualize your viewing and reading habits through rich recap statistics.


  The application allows users to build a personal diary of media, making it simple to organize collections, monitor current progress on series, and manage a backlog of future entertainment. It features seamless synchronization integrations with popular media servers like Plex and Jellyfin, ensuring that your watch history remains scrobbled and updated automatically without manual input.


  Floppy emphasizes simplicity and clarity in its design, delivering an intuitive retro-inspired user interface that focuses entirely on privacy and data ownership. With zero trackers or external telemetry, all your personal data, reviews, and logs stay safely on your Umbrel server. Floppy helps you take full control of your entertainment history and archive your life's media journey securely.
