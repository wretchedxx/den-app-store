version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: floppy_web_1
      APP_PORT: 8000

  web:
    image: ghcr.io/dannyvfilms/floppy:v26.8.20
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data/db:/floppy/db
      - ${APP_DATA_DIR}/data/backups:/floppy/backups
    environment:
      SECRET: "floppy_umbrel_secret_key_change_me"
      REGISTRATION: "true"
      TZ: "UTC"
